<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>請求管理画面</title>
  <script src="./js/ensure-local.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Segoe UI"', '"Hiragino Kaku Gothic ProN"', '"Noto Sans JP"', 'Meiryo', 'sans-serif'],
          },
          colors: {
            brand: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81',950:'#1e1b4b' },
            blue: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#6366f1',500:'#4f46e5',600:'#4338ca',700:'#3730a3',800:'#312e81',900:'#1e1b4b',950:'#131033' },
            cyan: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81',950:'#1e1b4b' },
            teal: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81',950:'#1e1b4b' },
          }
        }
      }
    };
  </script>
  <style>
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up { animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
    button, a { transition: all 0.2s ease; }
    button:active { transform: translateY(1px); }
    .invoice-table th,
    .invoice-table td {
      white-space: nowrap;
      vertical-align: middle;
      text-align: center;
    }
    .col-filter-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.35rem;
      height: 1.35rem;
      line-height: 1;
      vertical-align: middle;
    }
    .col-filter-btn svg {
      width: 0.85rem;
      height: 0.85rem;
      display: block;
    }
    .invoice-table td.text-wrap {
      white-space: normal;
      min-width: 8rem;
      max-width: 14rem;
      line-height: 1.35;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    #cashflowModal {
      display: none;
    }
    #cashflowModal.is-open {
      display: flex;
    }
    .cf-tab {
      color: #475569;
    }
    .cf-tab:hover {
      color: #1e293b;
    }
    .cf-tab.is-active {
      background-color: #ffffff;
      color: #4f46e5;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-slate-100 to-slate-200">
  <div class="bg-white/95 backdrop-blur-sm shadow-lg border-b-4 border-cyan-500">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-600 to-cyan-600 bg-clip-text text-transparent">請求管理表</h1>
      <div class="flex gap-2">
        <a href="./format.html" class="px-5 py-2 bg-white border-2 border-cyan-500 text-cyan-700 rounded-xl font-bold hover:bg-cyan-50">書式設定</a>
        <a href="./invoice.html" class="px-6 py-2 bg-gradient-to-r from-blue-600 to-cyan-600 text-white rounded-xl font-bold hover:from-blue-700 hover:to-cyan-700 shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">請求書作成へ</a>
      </div>
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-6 py-6 pb-8">
    <div class="bg-white rounded-2xl shadow-xl p-5 md:p-6 animate-fade-up">
      <h2 class="text-xl font-bold text-gray-800 mb-3 pb-2 border-b-2 border-cyan-500">請求一覧</h2>
      <div class="mb-3 flex flex-wrap items-center gap-2 text-sm">
        <div class="inline-flex items-center gap-2 bg-gradient-to-r from-cyan-50 to-blue-50 border border-cyan-200 rounded-lg px-3 py-1.5 shrink-0">
          <span class="text-gray-600 font-bold whitespace-nowrap">未入金</span>
          <span id="sumUnpaid" class="text-lg font-bold text-cyan-600 whitespace-nowrap">¥0</span>
        </div>
        <button type="button" id="clearColFiltersBtn" class="px-3 py-1.5 rounded-lg bg-white border border-gray-300 text-gray-700 font-bold hover:bg-gray-50">列フィルター解除</button>
        <button type="button" id="exportCsvBtn" class="px-3 py-1.5 rounded-lg bg-emerald-600 text-white font-bold hover:bg-emerald-700">CSV出力</button>
        <button type="button" id="openBulkModalBtn" class="ml-auto px-3 py-1.5 rounded-lg bg-amber-500 text-white font-bold hover:bg-amber-600">一括選択</button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full border-collapse invoice-table">
          <thead>
            <tr class="bg-gradient-to-r from-blue-600 to-cyan-600 text-white">
              <th class="border border-cyan-500 px-2 py-3 text-center font-bold w-10"></th>
              <th class="border border-cyan-500 px-2 py-3 text-center font-bold">
                請求番号
              </th>
              <th class="border border-cyan-500 px-2 py-3 text-center font-bold">
                <span class="inline-flex items-center gap-1">相手先<button type="button" class="col-filter-btn ml-0.5 rounded hover:bg-white/20" data-col="clientName" title="フィルター" aria-label="フィルター"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2 2.5h12l-4.2 5.2v4.3L6.2 14V7.7L2 2.5z"/></svg></button></span>
              </th>
              <th class="border border-cyan-500 px-2 py-3 text-center font-bold">
                <span class="inline-flex items-center gap-1">科目名<button type="button" class="col-filter-btn ml-0.5 rounded hover:bg-white/20" data-col="subjectName" title="フィルター" aria-label="フィルター"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2 2.5h12l-4.2 5.2v4.3L6.2 14V7.7L2 2.5z"/></svg></button></span>
              </th>
              <th class="border border-cyan-500 px-2 py-3 text-center font-bold">
                <span class="inline-flex items-center gap-1">大会名<button type="button" class="col-filter-btn ml-0.5 rounded hover:bg-white/20" data-col="category" title="フィルター" aria-label="フィルター"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2 2.5h12l-4.2 5.2v4.3L6.2 14V7.7L2 2.5z"/></svg></button></span>
              </th>
              <th class="border border-cyan-500 px-2 py-3 text-center font-bold">
                請求額
              </th>
              <th class="border border-cyan-500 px-2 py-3 text-center font-bold">
                未収金
              </th>
              <th class="border border-cyan-500 px-2 py-3 text-center font-bold">
                <span class="inline-flex items-center gap-1">期限状態<button type="button" class="col-filter-btn ml-0.5 rounded hover:bg-white/20" data-col="dueStatus" title="フィルター" aria-label="フィルター"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2 2.5h12l-4.2 5.2v4.3L6.2 14V7.7L2 2.5z"/></svg></button></span>
              </th>
              <th class="border border-cyan-500 px-2 py-3 text-center font-bold">
                <span class="inline-flex items-center gap-1">状態<button type="button" class="col-filter-btn ml-0.5 rounded hover:bg-white/20" data-col="status" title="フィルター" aria-label="フィルター"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2 2.5h12l-4.2 5.2v4.3L6.2 14V7.7L2 2.5z"/></svg></button></span>
              </th>
              <th class="border border-cyan-500 px-3 py-3 text-center font-bold">操作</th>
            </tr>
          </thead>
          <tbody id="invoiceTable">
            <tr><td colspan="10" class="border px-3 py-6 text-center text-gray-500">読み込み中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="colFilterMenu" class="hidden fixed z-[70] w-64 bg-white rounded-xl shadow-2xl ring-1 ring-gray-200 p-3 text-sm">
    <div class="flex gap-2 mb-2">
      <button type="button" id="colFilterSortAsc" class="flex-1 px-2 py-1.5 rounded-lg border border-gray-200 font-bold text-gray-700 hover:bg-slate-50">昇順 ▲</button>
      <button type="button" id="colFilterSortDesc" class="flex-1 px-2 py-1.5 rounded-lg border border-gray-200 font-bold text-gray-700 hover:bg-slate-50">降順 ▼</button>
    </div>
    <input id="colFilterSearch" type="text" placeholder="値を検索" class="w-full border border-gray-300 rounded-lg px-2 py-1.5 mb-2 outline-none focus:border-cyan-500">
    <label class="flex items-center gap-2 mb-2 font-bold text-gray-700">
      <input id="colFilterSelectAll" type="checkbox" class="rounded">
      <span>すべて選択</span>
    </label>
    <div id="colFilterValues" class="max-h-52 overflow-y-auto border border-gray-100 rounded-lg p-2 space-y-1 mb-2"></div>
    <div class="flex gap-2">
      <button type="button" id="colFilterApply" class="flex-1 px-3 py-1.5 rounded-lg bg-cyan-600 text-white font-bold hover:bg-cyan-700">OK</button>
      <button type="button" id="colFilterClear" class="flex-1 px-3 py-1.5 rounded-lg bg-gray-100 text-gray-700 font-bold hover:bg-gray-200">クリア</button>
    </div>
  </div>

  <div id="rowActionMenu" class="hidden fixed z-[60] bg-white rounded-xl shadow-2xl ring-1 ring-gray-200 py-1 w-40">
    <button type="button" id="rowMenuMemo" class="block w-full text-left px-4 py-2 text-sm font-bold text-purple-700 hover:bg-purple-50">メモ</button>
    <button type="button" id="rowMenuUnpaid" class="block w-full text-left px-4 py-2 text-sm font-bold text-orange-700 hover:bg-orange-50">未入金に戻す</button>
    <button type="button" id="rowMenuSave" class="block w-full text-left px-4 py-2 text-sm font-bold text-emerald-700 hover:bg-emerald-50">PDF保存</button>
    <button type="button" id="rowMenuPrint" class="block w-full text-left px-4 py-2 text-sm font-bold text-cyan-700 hover:bg-cyan-50">印刷</button>
    <button type="button" id="rowMenuDelete" class="block w-full text-left px-4 py-2 text-sm font-bold text-red-700 hover:bg-red-50">削除</button>
  </div>

  <div id="memoModal" class="hidden fixed inset-0 z-50 items-center justify-center bg-black/50 p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6">
      <div class="flex justify-between items-start mb-4">
        <div>
          <h2 class="text-xl font-bold text-gray-800 pb-3 border-b-2 border-purple-500">メモ</h2>
          <p id="memoModalTitle" class="text-sm text-gray-600 mt-1"></p>
        </div>
        <button type="button" id="memoModalClose" class="text-gray-500 hover:text-gray-800 text-2xl leading-none">&times;</button>
      </div>
      <textarea id="memoInput" rows="5" placeholder="この請求書に関するメモを入力" class="w-full border-2 border-gray-300 rounded-xl px-3 py-2 focus:border-purple-500 outline-none resize-y"></textarea>
      <div class="flex gap-2 mt-3">
        <button type="button" id="memoSaveBtn" class="px-5 py-2.5 rounded-xl bg-purple-600 text-white font-bold hover:bg-purple-700 shadow-md">保存</button>
        <button type="button" id="memoClearBtn" class="px-5 py-2.5 rounded-xl bg-gray-200 text-gray-700 font-bold hover:bg-gray-300">クリア</button>
      </div>
    </div>
  </div>

  <div id="bulkModal" class="hidden fixed inset-0 z-50 items-center justify-center bg-black/50 p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto p-6">
      <div class="flex justify-between items-center gap-4 mb-5">
        <h2 class="text-xl font-bold text-gray-800">一括操作</h2>
        <button type="button" id="bulkModalClose" class="text-gray-500 hover:text-gray-800 text-2xl leading-none shrink-0">&times;</button>
      </div>

      <div class="space-y-4">
        <section class="rounded-xl border border-slate-200 bg-slate-50 p-4">
          <div class="flex flex-wrap items-end justify-between gap-3 mb-3">
            <h3 class="font-bold text-gray-800">対象範囲</h3>
            <p id="bulkRangeHint" class="text-sm text-slate-600"></p>
          </div>
          <div class="flex flex-wrap items-end gap-3">
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1" for="bulkFromNo">From</label>
              <input id="bulkFromNo" type="text" inputmode="numeric" autocomplete="off" class="bulk-no-input border-2 border-gray-300 rounded-xl px-3 py-2.5 focus:border-cyan-500 outline-none w-32 text-center text-lg font-bold tracking-wide bg-white">
            </div>
            <div class="pb-2.5 text-gray-400 font-bold text-lg">〜</div>
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1" for="bulkToNo">To</label>
              <input id="bulkToNo" type="text" inputmode="numeric" autocomplete="off" class="bulk-no-input border-2 border-gray-300 rounded-xl px-3 py-2.5 focus:border-cyan-500 outline-none w-32 text-center text-lg font-bold tracking-wide bg-white">
            </div>
          </div>
        </section>

        <div class="flex gap-2 bg-slate-100 rounded-xl p-1">
          <button type="button" data-bulk-tab="update" class="bulk-tab flex-1 py-2.5 rounded-lg text-sm font-bold transition bg-white text-amber-800 shadow">内容を一括更新</button>
          <button type="button" data-bulk-tab="files" class="bulk-tab flex-1 py-2.5 rounded-lg text-sm font-bold transition text-slate-600 hover:text-slate-800">保存・削除</button>
        </div>

        <section id="bulkPanelUpdate" class="bulk-panel rounded-xl border border-amber-200 bg-amber-50/70 p-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1" for="bulkClosingDate">締め日</label>
              <input id="bulkClosingDate" type="date" class="border-2 border-gray-300 rounded-xl px-3 py-2 focus:border-cyan-500 outline-none w-full bg-white">
            </div>
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1" for="bulkDueDate">支払期限</label>
              <input id="bulkDueDate" type="date" class="border-2 border-gray-300 rounded-xl px-3 py-2 focus:border-cyan-500 outline-none w-full bg-white">
            </div>
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1" for="bulkCollectionDate">入金日</label>
              <input id="bulkCollectionDate" type="date" class="border-2 border-gray-300 rounded-xl px-3 py-2 focus:border-cyan-500 outline-none w-full bg-white">
            </div>
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1" for="bulkSubjectName">科目名</label>
              <input id="bulkSubjectName" type="text" class="border-2 border-gray-300 rounded-xl px-3 py-2 focus:border-cyan-500 outline-none w-full bg-white">
            </div>
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1" for="bulkCategory">大会名</label>
              <input id="bulkCategory" type="text" class="border-2 border-gray-300 rounded-xl px-3 py-2 focus:border-cyan-500 outline-none w-full bg-white">
            </div>
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1" for="bulkRequestDepartment">依頼部署</label>
              <input id="bulkRequestDepartment" type="text" class="border-2 border-gray-300 rounded-xl px-3 py-2 focus:border-cyan-500 outline-none w-full bg-white">
            </div>
          </div>
          <div class="mt-4 flex justify-end">
            <button id="bulkUpdateBtn" type="button" class="px-6 py-3 rounded-xl bg-amber-600 text-white font-bold hover:bg-amber-700 shadow-md">一括更新</button>
          </div>
        </section>

        <section id="bulkPanelFiles" class="bulk-panel hidden rounded-xl border border-slate-200 p-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <button id="bulkSaveBtn" type="button" class="w-full px-4 py-3 rounded-xl bg-emerald-600 text-white font-bold hover:bg-emerald-700 shadow-md">
              範囲のPDFを一括保存
            </button>
            <button id="bulkDeleteBtn" type="button" class="w-full px-4 py-3 rounded-xl bg-red-600 text-white font-bold hover:bg-red-700 shadow-md">
              範囲を一括削除
            </button>
          </div>
        </section>
      </div>
    </div>
  </div>

  <div id="cashflowModal" class="fixed inset-0 z-50 items-center justify-center bg-black/50 p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-hidden flex flex-col">
      <div class="bg-gradient-to-r from-blue-600 to-cyan-600 px-5 py-3.5 flex justify-between items-center">
        <div>
          <h2 class="text-lg font-bold text-white leading-tight">入金・返金</h2>
          <p id="cashflowModalTitle" class="text-xs text-cyan-50/90 mt-0.5"></p>
        </div>
        <button type="button" id="cashflowModalClose" class="text-white/80 hover:text-white text-2xl leading-none">&times;</button>
      </div>

      <div class="p-5 overflow-y-auto space-y-4">
        <div id="cashflowModalSummary" class="grid grid-cols-2 gap-2"></div>

        <div class="flex gap-1.5 bg-slate-100 rounded-xl p-1">
          <button type="button" data-cf-tab="collection" class="cf-tab flex-1 py-1.5 rounded-lg text-sm font-bold transition">入金</button>
          <button type="button" data-cf-tab="refund" class="cf-tab flex-1 py-1.5 rounded-lg text-sm font-bold transition">返金</button>
        </div>

        <div data-cf-panel="collection" class="cf-panel rounded-xl border border-blue-200 bg-blue-50 p-3">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">入金日</label>
              <input id="collectionDateInput" type="date" class="w-full border-2 border-gray-300 rounded-lg px-2 py-1.5 focus:border-blue-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">金額（円）</label>
              <input id="collectionAmountInput" type="number" min="1" class="w-full border-2 border-gray-300 rounded-lg px-2 py-1.5 focus:border-blue-500 outline-none">
            </div>
          </div>
          <div class="flex flex-wrap gap-2 mt-2.5">
            <button type="button" id="collectionPartialBtn" class="flex-1 min-w-[8rem] px-3 py-2 rounded-lg bg-blue-600 text-white text-sm font-bold hover:bg-blue-700">一部入金</button>
            <button type="button" id="collectionFullBtn" class="flex-1 min-w-[8rem] px-3 py-2 rounded-lg bg-blue-800 text-white text-sm font-bold hover:bg-blue-900">残高を全額入金</button>
          </div>
        </div>

        <div data-cf-panel="refund" class="cf-panel hidden rounded-xl border border-orange-200 bg-orange-50 p-3">
          <p class="text-xs text-gray-600 mb-2">過払い分を取引先へ返金します。</p>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">返金日</label>
              <input id="refundDateInput" type="date" class="w-full border-2 border-gray-300 rounded-lg px-2 py-1.5 focus:border-orange-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">返金額（円）</label>
              <input id="refundAmountInput" type="number" min="1" class="w-full border-2 border-gray-300 rounded-lg px-2 py-1.5 focus:border-orange-500 outline-none">
            </div>
          </div>
          <button type="button" id="refundSubmitBtn" class="mt-2.5 w-full px-3 py-2 rounded-lg bg-orange-600 text-white text-sm font-bold hover:bg-orange-700">返金を登録</button>
        </div>

        <div>
          <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wide mb-1.5">履歴</h3>
          <ul id="cashflowHistoryList" class="text-sm border border-gray-200 rounded-xl divide-y max-h-40 overflow-y-auto"></ul>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/firebase.js"></script>
  <script src="./js/db.js"></script>
  <script src="./js/date-utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.min.js"></script>
  <script>
    let invoices = [];
    let cashflowInvoiceId = null;

    function yen(value) {
      return "¥" + Number(value || 0).toLocaleString("ja-JP");
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function todayIso() {
      return new Date().toISOString().slice(0, 10);
    }

    function isOverpaid(row) {
      return calcOverpaid(row) > 0;
    }

    function statusText(row) {
      if (isOverpaid(row)) return "過払い";
      if (row.status === "paid") return "入金済";
      return "未入金";
    }

    function statusClass(row) {
      if (isOverpaid(row)) return "bg-orange-100 text-orange-800";
      if (row.status === "paid") return "bg-green-100 text-green-800";
      return "bg-red-100 text-red-800";
    }

    function calcRemaining(row) {
      return Math.max(0, Number(row.billedAmount || 0) - Number(row.totalPaid || 0));
    }

    function calcOverpaid(row) {
      return Math.max(0, Number(row.totalPaid || 0) - Number(row.billedAmount || 0));
    }

    function formatBalanceDiff(row) {
      const billed = Number(row.billedAmount || 0);
      const paid = Number(row.totalPaid || 0);
      const diff = paid - billed;
      if (diff === 0) return '<span class="text-gray-500">なし</span>';
      if (diff > 0) {
        return `<span class="text-orange-700 font-bold">過払い ${yen(diff)}</span>`;
      }
      return `<span class="text-red-700 font-bold">-${yen(Math.abs(diff)).slice(1)}</span>`;
    }

    function getInvoiceNoSortValue(row) {
      const raw = String(row?.invoiceNo ?? "").trim();
      if (/^\d+$/.test(raw)) return Number(raw);
      return Number.NEGATIVE_INFINITY;
    }

    function getDueStatus(row) {
      const dueDate = parseDateOnly(row.dueDate);
      if (!dueDate) {
        return { key: "no_due", label: "未設定", className: "bg-gray-100 text-gray-700" };
      }
      if (row.status === "paid") {
        return { key: "paid", label: "入金済", className: "bg-green-100 text-green-800" };
      }
      const today = new Date();
      const todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      if (dueDate.getTime() < todayStart.getTime()) {
        return { key: "overdue", label: "期限超過", className: "bg-red-100 text-red-800" };
      }
      if (dueDate.getTime() === todayStart.getTime()) {
        return { key: "today", label: "今日期限", className: "bg-amber-100 text-amber-800" };
      }
      return { key: "within", label: "期限内", className: "bg-cyan-100 text-cyan-800" };
    }

    const COLUMN_FILTER_KEYS = ["clientName", "subjectName", "category", "dueStatus", "status"];
    const columnFilters = Object.fromEntries(COLUMN_FILTER_KEYS.map((key) => [key, null]));
    let sortState = { key: "invoiceNo", asc: false };
    let activeFilterCol = null;

    function getColumnDisplayValue(row, col) {
      if (col === "invoiceNo") return String(row.invoiceNo || "-");
      if (col === "clientName") return String(row.clientName || "-");
      if (col === "subjectName") return String(row.subjectName || "-");
      if (col === "category") return String(row.category || "").trim() || "(なし)";
      if (col === "billedAmount") return yen(row.billedAmount);
      if (col === "remaining") {
        return isOverpaid(row) ? `過払 ${yen(calcOverpaid(row))}` : yen(calcRemaining(row));
      }
      if (col === "dueStatus") return getDueStatus(row).label;
      if (col === "status") return statusText(row);
      return "-";
    }

    function matchesColumnFilters(row, skipCol) {
      return COLUMN_FILTER_KEYS.every((col) => {
        if (col === skipCol) return true;
        const selected = columnFilters[col];
        if (!selected) return true;
        return selected.has(getColumnDisplayValue(row, col));
      });
    }

    function compareByColumn(a, b, col, asc) {
      if (col === "invoiceNo") {
        const aNo = getInvoiceNoSortValue(a);
        const bNo = getInvoiceNoSortValue(b);
        if (aNo !== bNo) return asc ? aNo - bNo : bNo - aNo;
      } else if (col === "billedAmount") {
        const av = Number(a.billedAmount || 0);
        const bv = Number(b.billedAmount || 0);
        if (av !== bv) return asc ? av - bv : bv - av;
      } else if (col === "remaining") {
        const av = isOverpaid(a) ? -calcOverpaid(a) : calcRemaining(a);
        const bv = isOverpaid(b) ? -calcOverpaid(b) : calcRemaining(b);
        if (av !== bv) return asc ? av - bv : bv - av;
      } else {
        const av = getColumnDisplayValue(a, col);
        const bv = getColumnDisplayValue(b, col);
        const cmp = av.localeCompare(bv, "ja");
        if (cmp !== 0) return asc ? cmp : -cmp;
      }
      const aNo = getInvoiceNoSortValue(a);
      const bNo = getInvoiceNoSortValue(b);
      return bNo - aNo;
    }

    function filterInvoicesByUi() {
      return invoices
        .filter((row) => matchesColumnFilters(row))
        .sort((a, b) => compareByColumn(a, b, sortState.key, sortState.asc));
    }

    function colFilterIconHtml(sorted, asc) {
      const funnel = '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2 2.5h12l-4.2 5.2v4.3L6.2 14V7.7L2 2.5z"/></svg>';
      if (!sorted) return funnel;
      const arrow = asc
        ? '<svg viewBox="0 0 10 10" aria-hidden="true" style="width:.55rem;height:.55rem;margin-left:1px"><path fill="currentColor" d="M5 1.5 8.5 7H1.5L5 1.5z"/></svg>'
        : '<svg viewBox="0 0 10 10" aria-hidden="true" style="width:.55rem;height:.55rem;margin-left:1px"><path fill="currentColor" d="M5 8.5 1.5 3h7L5 8.5z"/></svg>';
      return funnel + arrow;
    }

    function updateColFilterButtonStates() {
      document.querySelectorAll(".col-filter-btn").forEach((btn) => {
        const col = btn.getAttribute("data-col");
        const filtered = !!columnFilters[col];
        const sorted = sortState.key === col;
        btn.classList.toggle("bg-amber-300", filtered);
        btn.classList.toggle("text-amber-950", filtered);
        btn.classList.toggle("ring-2", sorted && !filtered);
        btn.classList.toggle("ring-white/70", sorted && !filtered);
        btn.innerHTML = colFilterIconHtml(sorted, sortState.asc);
      });
    }

    function closeColFilterMenu() {
      const menu = document.getElementById("colFilterMenu");
      if (menu) menu.classList.add("hidden");
      activeFilterCol = null;
    }

    function getUniqueValuesForColumn(col) {
      const set = new Set();
      invoices.forEach((row) => {
        if (!matchesColumnFilters(row, col)) return;
        set.add(getColumnDisplayValue(row, col));
      });
      return Array.from(set).sort((a, b) => a.localeCompare(b, "ja"));
    }

    function renderColFilterValues(values, selectedSet, query) {
      const box = document.getElementById("colFilterValues");
      const q = String(query || "").trim().toLowerCase();
      const filtered = q ? values.filter((v) => v.toLowerCase().includes(q)) : values;
      box.innerHTML = filtered.map((value) => {
        const checked = !selectedSet || selectedSet.has(value);
        return `<label class="flex items-start gap-2 text-gray-700">
          <input type="checkbox" class="col-filter-value mt-0.5" value="${escapeHtml(value)}" ${checked ? "checked" : ""}>
          <span class="break-all">${escapeHtml(value)}</span>
        </label>`;
      }).join("") || '<div class="text-gray-400 px-1 py-2">該当がありません</div>';
      syncColFilterSelectAll();
    }

    function syncColFilterSelectAll() {
      const boxes = Array.from(document.querySelectorAll("#colFilterValues .col-filter-value"));
      const all = document.getElementById("colFilterSelectAll");
      if (!all) return;
      all.checked = boxes.length > 0 && boxes.every((box) => box.checked);
      all.indeterminate = boxes.some((box) => box.checked) && !all.checked;
    }

    function openColFilterMenu(col, anchorBtn) {
      activeFilterCol = col;
      const menu = document.getElementById("colFilterMenu");
      const values = getUniqueValuesForColumn(col);
      const selected = columnFilters[col] ? new Set(columnFilters[col]) : null;
      document.getElementById("colFilterSearch").value = "";
      renderColFilterValues(values, selected, "");
      menu.classList.remove("hidden");
      const rect = anchorBtn.getBoundingClientRect();
      const menuWidth = 256;
      const left = Math.min(window.innerWidth - menuWidth - 8, Math.max(8, rect.left));
      const top = Math.min(window.innerHeight - 20, rect.bottom + 6);
      menu.style.left = `${left}px`;
      menu.style.top = `${top}px`;
    }

    function applyColFilterFromMenu() {
      if (!activeFilterCol) return;
      const boxes = Array.from(document.querySelectorAll("#colFilterValues .col-filter-value"));
      const checked = boxes.filter((box) => box.checked).map((box) => box.value);
      const allValues = getUniqueValuesForColumn(activeFilterCol);
      if (checked.length === 0) {
        columnFilters[activeFilterCol] = new Set(["__none__"]);
      } else if (checked.length >= allValues.length && allValues.every((v) => checked.includes(v))) {
        columnFilters[activeFilterCol] = null;
      } else {
        columnFilters[activeFilterCol] = new Set(checked);
      }
      closeColFilterMenu();
      render();
    }

    function clearActiveColFilter() {
      if (!activeFilterCol) return;
      columnFilters[activeFilterCol] = null;
      closeColFilterMenu();
      render();
    }

    function clearAllColumnFilters() {
      COLUMN_FILTER_KEYS.forEach((key) => {
        columnFilters[key] = null;
      });
      sortState = { key: "invoiceNo", asc: false };
      closeColFilterMenu();
      render();
    }

    function render() {
      const filtered = filterInvoicesByUi();
      updateColFilterButtonStates();

      const tbody = document.getElementById("invoiceTable");
      if (!filtered.length) {
        tbody.innerHTML = '<tr><td colspan="10" class="border px-3 py-6 text-center text-gray-500">データがありません</td></tr>';
      } else {
        tbody.innerHTML = filtered.map((row, index) => {
          const remain = calcRemaining(row);
          const dueStatus = getDueStatus(row);
          const dueDateLabel = normalizeDateInput(row.dueDate) || "-";
          const collectionLabel = normalizeDateInput(row.collectionDate) || "-";
          const refundLabel = normalizeDateInput(row.refundDate) || "-";
          const rowBg = index % 2 === 0 ? "bg-cyan-50" : "bg-white";
          const safeNo = (row.invoiceNo || "").replace(/'/g, "\\'");
          return `
            <tr class="${rowBg} hover:bg-cyan-100 transition">
              <td class="border px-2 py-2 text-center align-top">
                <button type="button" onclick="toggleDetailRow('${row.id}', this)" class="detail-toggle w-7 h-7 rounded-lg text-cyan-700 hover:bg-cyan-100 font-bold" title="詳細を表示">▶</button>
              </td>
              <td class="border px-3 py-2 align-top whitespace-nowrap text-center">${row.invoiceNo || "-"}${row.memo ? ' <span class="text-purple-600" title="メモあり">📝</span>' : ""}</td>
              <td class="border px-3 py-2 text-wrap align-top text-center">${row.clientName || "-"}</td>
              <td class="border px-3 py-2 text-wrap align-top text-center">${row.subjectName || "-"}</td>
              <td class="border px-3 py-2 text-wrap align-top text-center">${row.category || "-"}</td>
              <td class="border px-3 py-2 text-center align-top">${yen(row.billedAmount)}</td>
              <td class="border px-3 py-2 text-center font-bold align-top">${isOverpaid(row) ? `<span class="text-orange-700">${yen(calcOverpaid(row))}</span>` : yen(remain)}</td>
              <td class="border px-3 py-2 align-top text-center">
                <span class="px-2 py-1 rounded ${dueStatus.className}">${dueStatus.label}</span>
              </td>
              <td class="border px-3 py-2 align-top text-center">
                <span class="px-2 py-1 rounded ${statusClass(row)}">${statusText(row)}</span>
              </td>
              <td class="border px-3 py-2 text-center align-top whitespace-nowrap">
                <div class="inline-flex items-center gap-1">
                  <button onclick="editInvoice('${row.id}')" class="px-2 py-1 rounded-lg bg-gradient-to-r from-blue-600 to-cyan-600 text-white text-sm font-bold hover:from-blue-700 hover:to-cyan-700">編集</button>
                  <button onclick="openCashflowModal('${row.id}')" class="px-2 py-1 rounded-lg bg-blue-600 text-white text-sm font-bold hover:bg-blue-700">入金・返金</button>
                  <button type="button" onclick="openRowMenu(event, '${row.id}', '${safeNo}')" class="px-2 py-1 rounded-lg bg-gray-200 text-gray-700 text-sm font-bold hover:bg-gray-300" title="その他の操作">…</button>
                </div>
              </td>
            </tr>
            <tr id="detail-${row.id}" class="detail-row hidden ${rowBg}">
              <td class="border px-3 py-3" colspan="10">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-x-6 gap-y-2 text-sm">
                  <div><span class="text-gray-500">発行日</span><div class="font-bold text-gray-800">${row.issueDate || "-"}</div></div>
                  <div><span class="text-gray-500">振込期限</span><div class="font-bold text-gray-800">${dueDateLabel}</div></div>
                  <div><span class="text-gray-500">大会名</span><div class="font-bold text-gray-800">${row.category || "-"}</div></div>
                  <div><span class="text-gray-500">依頼部署</span><div class="font-bold text-gray-800">${row.requestDepartment || "-"}</div></div>
                  <div><span class="text-gray-500">入金済</span><div class="font-bold text-gray-800">${yen(row.totalPaid)}</div></div>
                  <div><span class="text-gray-500">入金日</span><div class="font-bold text-gray-800">${collectionLabel}</div></div>
                  <div><span class="text-gray-500">返金日</span><div class="font-bold text-gray-800">${refundLabel}</div></div>
                  <div><span class="text-gray-500">過不足</span><div class="font-bold">${formatBalanceDiff(row)}</div></div>
                </div>
                ${row.memo ? `<div class="mt-3 pt-3 border-t border-gray-200"><span class="text-gray-500 text-sm">メモ</span><div class="text-gray-800 whitespace-pre-wrap">${escapeHtml(row.memo)}</div></div>` : ""}
              </td>
            </tr>
          `;
        }).join("");
      }

      const sumUnpaid = filtered.reduce((acc, row) => acc + calcRemaining(row), 0);
      document.getElementById("sumUnpaid").textContent = yen(sumUnpaid);
    }

    function toggleDetailRow(invoiceId, btn) {
      const detail = document.getElementById(`detail-${invoiceId}`);
      if (!detail) return;
      const isHidden = detail.classList.toggle("hidden");
      if (btn) {
        btn.textContent = isHidden ? "▶" : "▼";
        btn.title = isHidden ? "詳細を表示" : "詳細を隠す";
      }
    }

    let rowMenuInvoiceId = null;
    let rowMenuInvoiceNo = "";

    function positionRowMenu(anchor) {
      const menu = document.getElementById("rowActionMenu");
      const rect = anchor.getBoundingClientRect();
      menu.classList.remove("hidden");
      const menuWidth = menu.offsetWidth;
      const menuHeight = menu.offsetHeight;
      let left = rect.right - menuWidth;
      if (left < 8) left = 8;
      let top = rect.bottom + 4;
      if (top + menuHeight > window.innerHeight - 8) {
        top = rect.top - menuHeight - 4;
      }
      menu.style.left = `${left}px`;
      menu.style.top = `${top}px`;
    }

    function openRowMenu(event, invoiceId, invoiceNo) {
      event.stopPropagation();
      rowMenuInvoiceId = invoiceId;
      rowMenuInvoiceNo = invoiceNo || "";
      positionRowMenu(event.currentTarget);
    }

    function closeRowMenu() {
      const menu = document.getElementById("rowActionMenu");
      if (menu) menu.classList.add("hidden");
      rowMenuInvoiceId = null;
    }

    function openBulkModal() {
      const modal = document.getElementById("bulkModal");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
      setBulkTab("update");
      updateBulkRangeHint();
      document.getElementById("bulkFromNo")?.focus();
    }

    function closeBulkModal() {
      const modal = document.getElementById("bulkModal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    function setBulkTab(tab) {
      const updatePanel = document.getElementById("bulkPanelUpdate");
      const filesPanel = document.getElementById("bulkPanelFiles");
      if (updatePanel) updatePanel.classList.toggle("hidden", tab !== "update");
      if (filesPanel) filesPanel.classList.toggle("hidden", tab !== "files");

      document.querySelectorAll(".bulk-tab").forEach((btn) => {
        const active = btn.getAttribute("data-bulk-tab") === tab;
        btn.classList.toggle("bg-white", active);
        btn.classList.toggle("shadow", active);
        btn.classList.toggle("text-amber-800", active && tab === "update");
        btn.classList.toggle("text-slate-800", active && tab === "files");
        btn.classList.toggle("text-slate-600", !active);
        btn.classList.toggle("hover:text-slate-800", !active);
      });
    }

    function clearBulkFormFieldsExceptRange() {
      [
        "bulkClosingDate",
        "bulkDueDate",
        "bulkCollectionDate",
        "bulkSubjectName",
        "bulkCategory",
        "bulkRequestDepartment",
      ].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.value = "";
      });
    }

    function updateBulkRangeHint() {
      const hint = document.getElementById("bulkRangeHint");
      if (!hint) return;
      const fromEmpty = !document.getElementById("bulkFromNo").value.trim();
      const toEmpty = !document.getElementById("bulkToNo").value.trim();
      if (fromEmpty && toEmpty) {
        hint.textContent = "";
        hint.className = "text-sm text-slate-600";
        return;
      }
      const { error, fromNo, toNo, targets } = getRangeTargets(true);
      if (error) {
        hint.textContent = error;
        hint.className = "text-sm text-red-600 font-bold";
        return;
      }
      hint.textContent = `${fromNo} 〜 ${toNo} ／ ${targets.length} 件`;
      hint.className = targets.length > 0
        ? "text-sm text-emerald-700 font-bold"
        : "text-sm text-amber-700 font-bold";
    }

    function sanitizeBulkNoInput(event) {
      const el = event.target;
      const cleaned = String(el.value || "").replace(/[^\d]/g, "");
      if (el.value !== cleaned) el.value = cleaned;
      updateBulkRangeHint();
    }

    let memoInvoiceId = null;

    function openMemoModal(invoiceId) {
      const row = invoices.find((item) => item.id === invoiceId);
      if (!row) {
        alert("請求書が見つかりません");
        return;
      }
      memoInvoiceId = invoiceId;
      document.getElementById("memoModalTitle").textContent =
        `No.${row.invoiceNo || "-"} ${row.clientName || ""}`;
      document.getElementById("memoInput").value = row.memo || "";
      const modal = document.getElementById("memoModal");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
      document.getElementById("memoInput").focus();
    }

    function closeMemoModal() {
      memoInvoiceId = null;
      const modal = document.getElementById("memoModal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    async function saveMemo() {
      if (!memoInvoiceId) return;
      const memo = document.getElementById("memoInput").value;
      try {
        await updateInvoiceMemo(memoInvoiceId, memo);
        const row = invoices.find((item) => item.id === memoInvoiceId);
        if (row) row.memo = String(memo || "");
        closeMemoModal();
        render();
      } catch (error) {
        console.error(error);
        alert("メモの保存に失敗しました: " + error.message);
      }
    }

    function getCurrentFilteredInvoices() {
      return filterInvoicesByUi();
    }

    function cleanExportText(value) {
      return String(value ?? "").replace(/[\r\n\t]+/g, " ").trim();
    }

    function exportColWidthCh(header, values) {
      let maxLen = String(header).length;
      values.forEach((value) => {
        maxLen = Math.max(maxLen, cleanExportText(value).length);
      });
      return Math.min(40, Math.max(8, Math.ceil(maxLen * 1.15) + 2));
    }

    function excelColName(index) {
      let n = index + 1;
      let name = "";
      while (n > 0) {
        const rem = (n - 1) % 26;
        name = String.fromCharCode(65 + rem) + name;
        n = Math.floor((n - 1) / 26);
      }
      return name;
    }

    function exportFilteredCsv() {
      if (typeof XLSX === "undefined") {
        alert("Excel出力用ライブラリの読み込みに失敗しました。ページを再読み込みしてください。");
        return;
      }

      const rows = filterInvoicesByUi()
        .slice()
        .sort((a, b) => compareByColumn(a, b, "invoiceNo", true));
      if (!rows.length) {
        alert("出力するデータがありません");
        return;
      }

      const headers = [
        "請求番号",
        "相手先",
        "科目名",
        "大会名",
        "請求額",
        "未収金",
        "振込期限",
        "入金日",
        "返金日",
        "備考",
        "メモ",
      ];
      const numberCols = new Set([4, 5]);
      const baseFont = { name: "游ゴシック", sz: 11 };

      const dataRows = rows.map((row) => {
        const unpaid = isOverpaid(row) ? 0 : calcRemaining(row);
        const due = getDueStatus(row);
        const hasPayment = Number(row.totalPaid || 0) > 0;
        const collectionDate = hasPayment ? (normalizeDateInput(row.collectionDate) || "") : "";
        return {
          values: [
            row.invoiceNo || "",
            row.clientName || "",
            row.subjectName || "",
            row.category || "",
            Number(row.billedAmount || 0),
            unpaid,
            normalizeDateInput(row.dueDate) || "",
            collectionDate,
            normalizeDateInput(row.refundDate) || "",
            row.description || "",
            row.memo || "",
          ],
          highlightDueDate: due.key === "overdue" && !hasPayment,
        };
      });

      const totalBilled = dataRows.reduce((sum, item) => sum + Number(item.values[4] || 0), 0);
      const totalUnpaid = dataRows.reduce((sum, item) => sum + Number(item.values[5] || 0), 0);
      const totalValues = headers.map((_, idx) => {
        if (idx === 0) return "合計";
        if (idx === 4) return totalBilled;
        if (idx === 5) return totalUnpaid;
        return "";
      });
      // 1行目:合計(フィルター外) / 2行目:ヘッダー / 3行目〜:データ
      // 合計をフィルター範囲外に置き、SUBTOTAL で可視行だけ集計する
      const aoa = [
        totalValues,
        headers,
        ...dataRows.map((item) => item.values),
      ];

      const ws = XLSX.utils.aoa_to_sheet(aoa);
      const totalRow = 1;
      const headerRow = 2;
      const dataStartRow = 3;
      const dataEndRow = 2 + dataRows.length;
      const lastCol = excelColName(headers.length - 1);
      const billedCol = excelColName(4);
      const unpaidCol = excelColName(5);

      ws["!autofilter"] = { ref: `A${headerRow}:${lastCol}${dataEndRow}` };
      ws["!cols"] = headers.map((header, idx) => ({
        wch: exportColWidthCh(header, dataRows.map((item) => item.values[idx])),
      }));
      // 1行分の高さに固定（折り返しで行が伸びないようにする）
      const rowHeight = { hpt: 18 };
      ws["!rows"] = Array.from({ length: dataEndRow }, () => ({ ...rowHeight }));

      const headerStyle = {
        font: { ...baseFont, bold: true, color: { rgb: "FFFFFF" } },
        fill: { patternType: "solid", fgColor: { rgb: "1E40AF" } },
        alignment: { horizontal: "center", vertical: "center", wrapText: false },
      };
      const textStyle = {
        font: { ...baseFont },
        alignment: { horizontal: "left", vertical: "center", wrapText: false },
      };
      const numberStyle = {
        font: { ...baseFont },
        alignment: { horizontal: "right", vertical: "center", wrapText: false },
        numFmt: "#,##0",
      };
      const yellowStyle = {
        font: { ...baseFont },
        fill: { patternType: "solid", fgColor: { rgb: "FDE047" } },
        alignment: { horizontal: "left", vertical: "center", wrapText: false },
      };
      const totalStyle = {
        font: { ...baseFont, bold: true },
        fill: { patternType: "solid", fgColor: { rgb: "F1F5F9" } },
        alignment: { horizontal: "left", vertical: "center", wrapText: false },
      };
      const totalNumberStyle = {
        font: { ...baseFont, bold: true },
        fill: { patternType: "solid", fgColor: { rgb: "F1F5F9" } },
        alignment: { horizontal: "right", vertical: "center", wrapText: false },
        numFmt: "#,##0",
      };

      headers.forEach((_, idx) => {
        const cell = ws[excelColName(idx) + headerRow];
        if (cell) cell.s = headerStyle;
      });

      headers.forEach((_, idx) => {
        const addr = excelColName(idx) + totalRow;
        const cell = ws[addr] || { t: "s", v: "" };
        if (idx === 4) {
          cell.t = "n";
          cell.f = `SUBTOTAL(109,${billedCol}${dataStartRow}:${billedCol}${dataEndRow})`;
          cell.v = totalBilled;
          cell.s = totalNumberStyle;
        } else if (idx === 5) {
          cell.t = "n";
          cell.f = `SUBTOTAL(109,${unpaidCol}${dataStartRow}:${unpaidCol}${dataEndRow})`;
          cell.v = totalUnpaid;
          cell.s = totalNumberStyle;
        } else {
          cell.t = "s";
          cell.v = idx === 0 ? "合計" : "";
          cell.s = totalStyle;
        }
        ws[addr] = cell;
      });

      dataRows.forEach((item, rowIdx) => {
        const excelRow = dataStartRow + rowIdx;
        item.values.forEach((value, colIdx) => {
          const addr = excelColName(colIdx) + excelRow;
          const cell = ws[addr];
          if (!cell) return;
          // 期限超過かつ未入金: 未収金(5)〜入金日(7)を黄色
          if ((colIdx === 5 || colIdx === 6 || colIdx === 7) && item.highlightDueDate) {
            if (numberCols.has(colIdx)) {
              cell.t = "n";
              cell.v = Number(value || 0);
              cell.s = { ...yellowStyle, alignment: { horizontal: "right", vertical: "center", wrapText: false }, numFmt: "#,##0" };
            } else {
              cell.s = yellowStyle;
              cell.t = "s";
              cell.v = cleanExportText(value);
            }
          } else if (numberCols.has(colIdx)) {
            cell.t = "n";
            cell.v = Number(value || 0);
            cell.s = numberStyle;
          } else {
            cell.t = "s";
            cell.v = cleanExportText(value);
            cell.s = textStyle;
          }
        });
      });

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "請求一覧");
      // 本物の xlsx (ZIP/OOXML) として保存。拡張子警告を防ぐ
      const fileName = `請求一覧${todayIso().replace(/-/g, "")}.xlsx`;
      const out = XLSX.write(wb, { bookType: "xlsx", type: "array", cellStyles: true });
      const blob = new Blob([out], {
        type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    const pdfDownloadWaiters = new Map();

    window.addEventListener("message", (event) => {
      if (event.origin !== window.location.origin) return;
      const data = event.data;
      if (!data || data.type !== "invoice-pdf-download") return;
      const waiter = pdfDownloadWaiters.get(data.invoiceId);
      if (!waiter) return;
      clearTimeout(waiter.timer);
      pdfDownloadWaiters.delete(data.invoiceId);
      if (data.status === "ok") {
        waiter.resolve();
      } else {
        waiter.reject(new Error(data.detail || "PDF保存に失敗しました"));
      }
    });

    function savePdf(invoiceId) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          pdfDownloadWaiters.delete(invoiceId);
          reject(new Error("PDF保存がタイムアウトしました"));
        }, 90000);

        pdfDownloadWaiters.set(invoiceId, { resolve, reject, timer });

        const existing = document.getElementById("pdfDownloadFrame");
        if (existing) existing.remove();
        const frame = document.createElement("iframe");
        frame.id = "pdfDownloadFrame";
        frame.style.position = "fixed";
        frame.style.left = "-12000px";
        frame.style.top = "0";
        frame.style.width = "1100px";
        frame.style.height = "1600px";
        frame.style.opacity = "0";
        frame.style.pointerEvents = "none";
        frame.style.border = "0";
        frame.src = "./invoice-print.html?id=" + encodeURIComponent(invoiceId) + "&download=1&t=" + Date.now();
        document.body.appendChild(frame);
      });
    }

    function wait(ms) {

    function getRangeTargets(useAllInvoices) {
      const fromValue = document.getElementById("bulkFromNo").value.trim();
      const toValue = document.getElementById("bulkToNo").value.trim();
      if (!fromValue && !toValue) {
        return { error: "From/To のどちらかを入力してください", targets: [] };
      }

      let fromNo = fromValue ? Number(fromValue) : Number.NaN;
      let toNo = toValue ? Number(toValue) : Number.NaN;
      if (Number.isNaN(fromNo) && !Number.isNaN(toNo)) fromNo = toNo;
      if (Number.isNaN(toNo) && !Number.isNaN(fromNo)) toNo = fromNo;
      if (!Number.isFinite(fromNo) || !Number.isFinite(toNo)) {
        return { error: "範囲指定の数字が不正です", targets: [] };
      }
      if (fromNo > toNo) {
        const temp = fromNo;
        fromNo = toNo;
        toNo = temp;
      }

      const filtered = useAllInvoices ? invoices : getCurrentFilteredInvoices();
      const targets = filtered
        .map((row) => ({ ...row, invoiceNoNum: Number(row.invoiceNo) }))
        .filter((row) => Number.isFinite(row.invoiceNoNum))
        .filter((row) => row.invoiceNoNum >= fromNo && row.invoiceNoNum <= toNo)
        .sort((a, b) => a.invoiceNoNum - b.invoiceNoNum);

      return { fromNo, toNo, targets };
    }

    function setBulkActionBusy(btn, busyText) {
      if (!btn) return;
      if (!btn.dataset.idleHtml) btn.dataset.idleHtml = btn.innerHTML;
      btn.disabled = true;
      btn.textContent = busyText;
    }

    function clearBulkActionBusy(btn) {
      if (!btn) return;
      btn.disabled = false;
      if (btn.dataset.idleHtml) btn.innerHTML = btn.dataset.idleHtml;
    }

    async function bulkSavePdf() {
      const { error, targets } = getRangeTargets(true);
      if (error) {
        alert(error);
        return;
      }
      if (targets.length === 0) {
        alert("指定範囲に一致する請求書がありません");
        return;
      }

      const ok = confirm(`${targets.length}件の請求書PDFを順番に保存します。実行しますか？`);
      if (!ok) return;

      const bulkBtn = document.getElementById("bulkSaveBtn");
      const deleteBtn = document.getElementById("bulkDeleteBtn");
      setBulkActionBusy(bulkBtn, "保存中…");
      if (deleteBtn) deleteBtn.disabled = true;

      const failed = [];
      let saved = 0;

      try {
        for (const row of targets) {
          setBulkActionBusy(bulkBtn, `保存中… ${saved + 1}/${targets.length}`);
          try {
            await savePdf(row.id);
            saved += 1;
            await wait(500);
          } catch (saveError) {
            console.error(saveError);
            failed.push({
              invoiceNo: row.invoiceNo || "-",
              clientName: row.clientName || "",
              message: saveError.message,
            });
          }
        }

        if (failed.length === 0) {
          alert(`一括保存が完了しました（${targets.length}件）`);
        } else {
          const failedLines = failed
            .map((item) => `No.${item.invoiceNo} ${item.clientName}: ${item.message}`)
            .join("\n");
          alert(
            `一括保存が完了しました（成功 ${saved}件 / 失敗 ${failed.length}件）\n\n失敗した請求書:\n${failedLines}`
          );
        }
      } finally {
        clearBulkActionBusy(bulkBtn);
        if (deleteBtn) deleteBtn.disabled = false;
      }
    }

    async function bulkUpdateInvoices() {
      const { error, targets } = getRangeTargets();
      if (error) {
        alert(error);
        return;
      }
      if (targets.length === 0) {
        alert("指定範囲に一致する請求書がありません");
        return;
      }

      const patch = {};
      const closingDate = document.getElementById("bulkClosingDate").value.trim();
      const dueDate = document.getElementById("bulkDueDate").value.trim();
      const collectionDate = document.getElementById("bulkCollectionDate").value.trim();
      const subjectName = document.getElementById("bulkSubjectName").value.trim();
      const category = document.getElementById("bulkCategory").value.trim();
      const requestDepartment = document.getElementById("bulkRequestDepartment").value.trim();

      if (closingDate) patch.closingDate = closingDate;
      if (dueDate) patch.dueDate = dueDate;
      if (subjectName) patch.subjectName = subjectName;
      if (category) patch.category = category;
      if (requestDepartment) patch.requestDepartment = requestDepartment;

      if (Object.keys(patch).length === 0 && !collectionDate) {
        alert("更新する項目を1つ以上入力してください");
        return;
      }

      const ok = confirm(`${targets.length}件を一括更新します。実行しますか？`);
      if (!ok) return;

      try {
        let settledCount = 0;
        let dateOnlyCount = 0;
        for (const row of targets) {
          if (Object.keys(patch).length > 0) {
            await updateInvoiceData(row.id, patch);
          }
          if (collectionDate) {
            const remaining = calcRemaining(row);
            if (remaining > 0) {
              await settleInvoiceFull(row.id, collectionDate, "");
              settledCount += 1;
            } else {
              await setInvoiceCollectionDate(row.id, collectionDate);
              dateOnlyCount += 1;
            }
          }
        }
        await loadInvoices();
        clearBulkFormFieldsExceptRange();
        updateBulkRangeHint();
        if (collectionDate && settledCount > 0) {
          alert(`一括更新が完了しました（${targets.length}件）\n全額入金を登録: ${settledCount}件\n入金日のみ更新: ${dateOnlyCount}件`);
        } else {
          alert(`一括更新が完了しました（${targets.length}件）`);
        }
      } catch (error2) {
        console.error(error2);
        alert("一括更新に失敗しました: " + error2.message);
      }
    }

        if (saveBtn) saveBtn.disabled = false;
      }
    }

    function buildTaxPatchByPrompt(row) {
      const defaultTaxRate = (row.taxRate === "other" || row.taxRate === null || row.taxRate === undefined)
        ? "other"
        : String(row.taxRate);
      const taxRateStr = prompt("消費税率（10/8/0 または other）", defaultTaxRate || "10");
      if (taxRateStr === null) return null;
      const normalizedTaxRate = taxRateStr.trim().toLowerCase();

      let taxRate;
      let baseAmount;
      let taxAmount;
      let billedAmount;
      let occurrenceAmount;

      if (normalizedTaxRate === "other") {
        taxRate = "other";
        const occurrenceStr = prompt("発生額（円）", String(row.occurrenceAmount ?? row.baseAmount ?? 0));
        if (occurrenceStr === null) return null;
        occurrenceAmount = Number(occurrenceStr);
        if (!Number.isFinite(occurrenceAmount) || occurrenceAmount < 0) {
          alert("発生額は0以上の数値で入力してください");
          return null;
        }

        const taxAmountStr = prompt("消費税額（円）", String(row.taxAmount ?? 0));
        if (taxAmountStr === null) return null;
        taxAmount = Number(taxAmountStr);
        if (!Number.isFinite(taxAmount) || taxAmount < 0) {
          alert("消費税額は0以上の数値で入力してください");
          return null;
        }

        baseAmount = occurrenceAmount;
        billedAmount = occurrenceAmount + taxAmount;
      } else {
        taxRate = Number(normalizedTaxRate);
        if (![0, 8, 10].includes(taxRate)) {
          alert("消費税率は 10 / 8 / 0 / other のいずれかで入力してください");
          return null;
        }

        const baseAmountStr = prompt("税抜金額（円）", String(row.baseAmount ?? 0));
        if (baseAmountStr === null) return null;
        baseAmount = Number(baseAmountStr);
        if (!Number.isFinite(baseAmount) || baseAmount < 0) {
          alert("税抜金額は0以上の数値で入力してください");
          return null;
        }

        taxAmount = Math.floor((baseAmount * taxRate) / 100);
        occurrenceAmount = baseAmount + taxAmount;
        billedAmount = occurrenceAmount;
      }

      return {
        taxRate,
        baseAmount,
        taxAmount,
        occurrenceAmount,
        billedAmount,
      };
    }

    async function editInvoice(invoiceId) {
      const row = invoices.find((item) => item.id === invoiceId);
      if (!row) {
        alert("対象の請求書が見つかりません");
        return;
      }

      const choice = prompt(
        "編集項目を番号で選択してください:\n"
        + "1: 請求先会社名\n"
        + "2: 科目名\n"
        + "3: 大会名\n"
        + "4: 依頼部署\n"
        + "5: 備考\n"
        + "6: 発行日\n"
        + "7: 締め日\n"
        + "8: 支払期限\n"
        + "9: 税情報（税率/発生額/消費税額）\n"
        + "10: 当連盟担当（理事名）",
        "1"
      );
      if (choice === null) return;

      const patch = {};
      const selected = choice.trim();
      if (selected === "1") {
        const v = prompt("請求先会社名", row.clientName || "");
        if (v === null) return;
        patch.clientName = v.trim();
      } else if (selected === "2") {
        const v = prompt("科目名（空欄可）", row.subjectName || "");
        if (v === null) return;
        patch.subjectName = v.trim();
      } else if (selected === "3") {
        const v = prompt("大会名（空欄可）", row.category || "");
        if (v === null) return;
        patch.category = v.trim();
      } else if (selected === "4") {
        const v = prompt("依頼部署（空欄可）", row.requestDepartment || "");
        if (v === null) return;
        patch.requestDepartment = v.trim();
      } else if (selected === "5") {
        const v = prompt("備考（空欄可）", row.description || "");
        if (v === null) return;
        patch.description = v.trim();
      } else if (selected === "6") {
        const v = prompt("発行日（YYYY-MM-DD）", row.issueDate || "");
        if (v === null) return;
        patch.issueDate = v.trim();
      } else if (selected === "7") {
        const v = prompt("締め日（YYYY-MM-DD）", row.closingDate || "");
        if (v === null) return;
        patch.closingDate = v.trim();
      } else if (selected === "8") {
        const v = prompt("支払期限（YYYY-MM-DD）", row.dueDate || "");
        if (v === null) return;
        patch.dueDate = v.trim();
      } else if (selected === "9") {
        const taxPatch = buildTaxPatchByPrompt(row);
        if (!taxPatch) return;
        Object.assign(patch, taxPatch);
      } else if (selected === "10") {
        const v = prompt("当連盟担当（理事名・空欄可）", row.clientContact || "");
        if (v === null) return;
        patch.clientContact = v.trim();
      } else {
        alert("1〜10 の番号で入力してください");
        return;
      }

      if (Object.keys(patch).length === 0) {
        alert("更新項目がありません");
        return;
      }

      try {
        await updateInvoiceData(invoiceId, patch);
        await loadInvoices();
        alert("請求書データを更新しました");
      } catch (error) {
        console.error(error);
        alert("請求書データの更新に失敗しました: " + error.message);
      }
    }
